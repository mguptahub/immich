# NOTE: automatic triggers disabled for this fork - this workflow mirrors
# immich-app/immich upstream CI/community-management and doesn't apply here
# (missing org secrets/reusable workflows it depends on). Kept as reference
# and still runnable manually via workflow_dispatch. See build-docker.yml for
# this fork's own image build/publish workflow.
name: Zizmor

on:
  workflow_dispatch:
jobs:
  zizmor:
    name: Zizmor
    uses: immich-app/devtools/.github/workflows/shared-zizmor.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write
    secrets: inherit
