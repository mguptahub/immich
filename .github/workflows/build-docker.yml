name: Build and Publish Docker Image

# This fork's own build/publish workflow - replaces upstream's docker.yml, which
# depends on immich-app org secrets and reusable workflows this fork doesn't have.
# Builds server/Dockerfile only (this fork doesn't modify machine-learning) and
# pushes to this repo's own GHCR namespace.
#
# Deliberately does NOT run on every push to `production` - only on publishing a
# GitHub Release (tags the image `latest` + the release's semver) or a manual
# workflow_dispatch (tags only `sha-<short-sha>`, no `latest`, so ad-hoc runs
# can't silently move what `latest` points to). On a release, docker-compose.prod.yml
# and example.env are also attached to the release as downloadable assets.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/immich-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
            BUILD_IMAGE=${{ github.repository }}
            BUILD_ID=${{ github.run_id }}

      - name: Attach install files to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docker/docker-compose.prod.yml
            docker/example.env
